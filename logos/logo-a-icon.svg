<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- White background -->
  <rect width="200" height="200" fill="#ffffff"/>

  <!-- Subtle circular bg accent -->
  <circle cx="100" cy="100" r="85" fill="#f59e0b" opacity="0.06"/>

  <!-- Cactus Icon (centered in 200x200) -->
  <!-- Main trunk -->
  <rect x="91" y="55" width="18" height="115" rx="9" fill="#f59e0b"/>
  <!-- Left arm connector -->
  <rect x="55" y="85" width="18" height="60" rx="9" fill="#f59e0b"/>
  <rect x="55" y="82" width="54" height="18" rx="9" fill="#f59e0b"/>
  <!-- Right arm connector -->
  <rect x="127" y="95" width="18" height="55" rx="9" fill="#f59e0b"/>
  <rect x="91" y="92" width="54" height="18" rx="9" fill="#f59e0b"/>

  <!-- Digital pixel dots at top -->
  <rect x="86" y="38" width="7" height="7" rx="1.5" fill="#f59e0b" opacity="0.9"/>
  <rect x="97" y="32" width="7" height="7" rx="1.5" fill="#f59e0b"/>
  <rect x="108" y="38" width="7" height="7" rx="1.5" fill="#f59e0b" opacity="0.9"/>
  <rect x="86" y="48" width="7" height="7" rx="1.5" fill="#f59e0b" opacity="0.5"/>
  <rect x="97" y="43" width="7" height="7" rx="1.5" fill="#f59e0b" opacity="0.7"/>
  <rect x="108" y="48" width="7" height="7" rx="1.5" fill="#f59e0b" opacity="0.5"/>

  <!-- Glow -->
  <ellipse cx="100" cy="45" rx="26" ry="18" fill="#f59e0b" opacity="0.07"/>
</svg>
