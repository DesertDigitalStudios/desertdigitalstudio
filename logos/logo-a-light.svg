<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <!-- Light background -->
  <rect width="600" height="200" fill="#ffffff"/>

  <!-- Cactus Icon (centered at x=80, vertically centered) -->
  <!-- Main trunk -->
  <rect x="73" y="60" width="14" height="100" rx="7" fill="#f59e0b"/>
  <!-- Left arm -->
  <rect x="45" y="85" width="14" height="50" rx="7" fill="#f59e0b"/>
  <rect x="45" y="82" width="42" height="14" rx="7" fill="#f59e0b"/>
  <!-- Right arm -->
  <rect x="101" y="90" width="14" height="45" rx="7" fill="#f59e0b"/>
  <rect x="73" y="87" width="42" height="14" rx="7" fill="#f59e0b"/>

  <!-- Digital pixel dots at top of cactus -->
  <rect x="70" y="48" width="5" height="5" rx="1" fill="#f59e0b" opacity="0.9"/>
  <rect x="78" y="44" width="5" height="5" rx="1" fill="#f59e0b"/>
  <rect x="86" y="48" width="5" height="5" rx="1" fill="#f59e0b" opacity="0.9"/>
  <rect x="70" y="56" width="5" height="5" rx="1" fill="#f59e0b" opacity="0.5"/>
  <rect x="78" y="52" width="5" height="5" rx="1" fill="#f59e0b" opacity="0.7"/>
  <rect x="86" y="56" width="5" height="5" rx="1" fill="#f59e0b" opacity="0.5"/>

  <!-- Subtle glow behind pixel dots -->
  <ellipse cx="80" cy="52" rx="20" ry="14" fill="#f59e0b" opacity="0.06"/>

  <!-- Wordmark -->
  <!-- DESERT DIGITAL -->
  <text x="155" y="110" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#1a1a2e" letter-spacing="2">DESERT DIGITAL</text>
  <!-- Amber accent on "DIGITAL" -->
  <!-- STUDIO -->
  <text x="155" y="142" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#f59e0b" letter-spacing="8">STUDIO</text>

  <!-- Thin divider line -->
  <line x1="155" y1="120" x2="520" y2="120" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
</svg>
